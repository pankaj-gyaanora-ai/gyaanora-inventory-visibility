<script>
const RUN = __RUN_DATA__;
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const fmt = n => (n === null || n === undefined) ? '—' : Number(n).toLocaleString();
const money = n => '$' + Number(n||0).toLocaleString(undefined,{maximumFractionDigits:0});
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ITEMS = RUN.items, EXC = RUN.exceptions, K = RUN.kpis;
const ITEM = Object.fromEntries(ITEMS.map(i => [i.sku, i]));
const sevClass = s => ({critical:'t-crit',warning:'t-warn',info:'t-info'}[s] || 't-info');

/* Weekly demand history drawn against the forecast rate. Inline SVG so the
   console stays a single file with no chart library and no network. */
function sparkline(values, forecastLevel){
  if(!values || values.length < 2) return '<p class="small muted">No demand history for this SKU.</p>';
  const w = 460, h = 90, pad = 6;
  const max = Math.max(...values, forecastLevel || 0, 1);
  const x = i => pad + i * (w - pad * 2) / (values.length - 1);
  const y = v => h - pad - (v / max) * (h - pad * 2);
  const bars = values.map((v,i) => {
    const bw = Math.max((w - pad * 2) / values.length - 3, 3);
    return '<rect x="' + (x(i) - bw / 2) + '" y="' + y(v) + '" width="' + bw +
           '" height="' + Math.max(h - pad - y(v), 0) + '" rx="1.5" fill="#cbd5e1"/>';
  }).join('');
  const fy = y(forecastLevel || 0);
  const line = forecastLevel ? '<line x1="' + pad + '" x2="' + (w - pad) + '" y1="' + fy + '" y2="' + fy +
    '" stroke="#1d4ed8" stroke-width="1.6" stroke-dasharray="4 3"/>' +
    '<text x="' + (w - pad) + '" y="' + Math.max(fy - 5, 10) + '" text-anchor="end" font-size="10" ' +
    'fill="#1d4ed8" font-family="ui-monospace,Menlo,monospace">forecast ' + forecastLevel + '/wk</text>' : '';
  return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
         bars + line + '</svg>' +
         '<div class="legend"><span><i style="background:#cbd5e1"></i>weekly units shipped, last ' +
         values.length + ' weeks</span><span><i style="background:#1d4ed8"></i>modelled rate</span></div>';
}

/* ---------------- export helpers ---------------- */
function toCsv(rows){
  const cell = v => {
    const t = v === null || v === undefined ? '' : String(v);
    return /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
  };
  return rows.map(r => r.map(cell).join(',')).join('\n');
}
function download(filename, text){
  const url = URL.createObjectURL(new Blob([text], {type:'text/csv;charset=utf-8'}));
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); setTimeout(() => URL.revokeObjectURL(url), 400);
}
const stamp = () => RUN.run_id.replace(/[^A-Za-z0-9_-]/g, '');

/* ---------------- header + nav ---------------- */
$('#hRun').textContent = RUN.run_id;
$('#hAsOf').textContent = RUN.generated_at.replace('T',' ').slice(0,16) + ' UTC';
$('#hVer').textContent = 'v' + RUN.engine_version;
$('#hStatus').textContent = RUN.status === 'OK' ? 'PUBLISHED' : RUN.status;
$('#ccAsOf').textContent = RUN.generated_at.replace('T',' ').slice(0,16) + ' UTC';
$('#nExc').textContent = EXC.length;
$('#nInv').textContent = ITEMS.length;

$('#ccSchedule').innerHTML = [
  ['Reconciliation run', RUN.generated_at.replace('T',' ').slice(0,16) + ' UTC'],
  ['Next scheduled run', 'tomorrow 06:15 UTC'],
  ['Feeds reconciled', RUN.sources.length + ' of ' + RUN.sources.length],
  ['Rows processed', fmt(RUN.manifest.rows_in)],
  ['Run outcome', RUN.status + ' · exit ' + RUN.exit_code],
].map(x => '<div><span class="muted">' + x[0] + '</span><br><b>' + x[1] + '</b></div>').join('') +
  '<div style="margin-left:auto"><button class="btn" id="ccExport">Export availability</button></div>';

$('#appFooter').innerHTML =
  '<span>Inventory Visibility Availability Platform v' + RUN.engine_version + '</span>' +
  '<span class="mono">' + RUN.run_id + '</span>' +
  '<span>' + fmt(RUN.manifest.rows_in) + ' rows in · ' + fmt(RUN.manifest.accepted) + ' accepted · ' +
  RUN.manifest.quarantined + ' quarantined</span>' +
  '<span>Availability computed by the engine; advisory layers are labelled as such.</span>';
$$('nav button').forEach(b => b.onclick = () => {
  $$('nav button').forEach(x => x.classList.remove('on')); b.classList.add('on');
  $$('.panel').forEach(p => p.classList.remove('on')); $('#p-' + b.dataset.p).classList.add('on');
  window.scrollTo(0,0);
});

/* ---------------- command centre ---------------- */
$('#ccCards').innerHTML = [
  ['blue','True available today', fmt(K.total_available) + ' u',
   'Across ' + fmt(K.skus) + ' SKUs and 3 warehouses, after reservations, damage and safety stock.'],
  ['crit','Availability overstated by', fmt(K.overstatement_units) + ' u',
   'What the old WMS + inbound eyeball reading showed, minus reality — ' + K.overstatement_pct + '% too high.'],
  ['crit','Revenue at risk', money(K.revenue_at_risk),
   K.oversold_skus + ' SKUs already promised beyond stock, ' + fmt(K.units_short) + ' units short.'],
  ['warn','Orders exposed to penalties', fmt(K.orders_with_penalty_exposure),
   'Open orders on oversold SKUs carrying an OTIF chargeback clause.'],
  ['warn','Open exceptions', RUN.summary.critical + ' / ' + RUN.summary.warning,
   'Critical / warning. Worked from the exception queue each morning.'],
  ['good','Manual reconciliation', '0 min',
   'Down from about an hour of spreadsheet work per day. Run time: under two seconds.'],
].map(([c,l,v,h]) => '<div class="card ' + c + '"><div class="lab">' + l + '</div><div class="val">' + v + '</div><div class="hint">' + h + '</div></div>').join('');

const naive = K.naive_number, truth = K.total_available;
const otherLoss = naive - K.total_reserved - K.total_inbound - truth;
$('#ccCompare').innerHTML =
  '<div class="tw"><table><tbody>' +
  '<tr><td><b>What ops read from the WMS export</b><br><span class="small muted">On hand, plus anything showing as inbound</span></td>' +
  '<td class="num" style="font-size:21px;font-weight:700;color:var(--crit)">' + fmt(naive) + '</td></tr>' +
  '<tr><td>less units already reserved by open orders</td><td class="num">−' + fmt(K.total_reserved) + '</td></tr>' +
  '<tr><td>less inbound stock that has not arrived</td><td class="num">−' + fmt(K.total_inbound) + '</td></tr>' +
  '<tr><td>less damaged, blocked and safety stock</td><td class="num">−' + fmt(otherLoss) + '</td></tr>' +
  '<tr style="background:var(--okbg)"><td><b>Available to sell today</b><br><span class="small muted">The one number the dashboard now publishes</span></td>' +
  '<td class="num" style="font-size:21px;font-weight:700;color:var(--ok)">' + fmt(truth) + '</td></tr>' +
  '</tbody></table></div>';
$('#ccNote').innerHTML = '<b>This gap is the oversell.</b> Selling against the top number instead of the bottom one is how ' +
  K.oversold_skus + ' SKUs came to be promised beyond stock, exposing ' + money(K.revenue_at_risk) +
  ' of revenue and ' + fmt(K.orders_with_penalty_exposure) + ' penalty-bearing orders.';

const segs = [['Sellable today', truth, '#047857'], ['Reserved by open orders', K.total_reserved, '#b45309'],
              ['Inbound, not yet here', K.total_inbound, '#1d4ed8'],
              ['Damaged / blocked / buffer', Math.max(otherLoss, 0), '#be123c']];
const tot = segs.reduce((a,s) => a + s[1], 0) || 1;
$('#ccWaterfall').innerHTML =
  '<div class="bar">' + segs.map(s => '<i style="width:' + (s[1]/tot*100) + '%;background:' + s[2] + '"></i>').join('') + '</div>' +
  '<div class="legend">' + segs.map(s => '<span><i style="background:' + s[2] + '"></i>' + s[0] + ' — <b>' + fmt(s[1]) + '</b></span>').join('') + '</div>' +
  '<div class="tw"><table style="margin-top:16px"><tbody>' + segs.map(s =>
    '<tr><td><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:' + s[2] + ';margin-right:8px"></i>' + s[0] + '</td>' +
    '<td class="num">' + fmt(s[1]) + '</td><td class="num muted">' + (s[1]/tot*100).toFixed(1) + '%</td></tr>').join('') + '</tbody></table></div>';

$('#ccTop').innerHTML = EXC.filter(e => e.flag === 'OVERSOLD')
  .sort((a,b) => (b.detail.revenue_at_risk||0) - (a.detail.revenue_at_risk||0)).slice(0,8)
  .map(e => '<tr class="clk" onclick="openSku(\'' + e.sku + '\')">' +
      '<td class="sku">' + e.sku + '</td><td><span class="tag t-crit">OVERSOLD</span></td>' +
      '<td class="num">' + fmt(e.detail.shortfall) + '</td><td class="num">' + money(e.detail.revenue_at_risk) + '</td>' +
      '<td class="small muted">' + esc(e.suggested_action) + '</td></tr>').join('')
  || '<tr><td colspan="5" class="empty">No oversold SKUs in this run.</td></tr>';

$('#ccFeeds').innerHTML = RUN.sources.map(s => {
  const state = !s.loaded ? ['MISSING','t-crit','#be123c'] : (s.stale ? ['STALE','t-warn','#b45309'] : ['HEALTHY','t-ok','#047857']);
  return '<div class="feed"><div class="ic" style="background:' + state[2] + '">' + s.name.slice(0,2).toUpperCase() + '</div>' +
    '<div class="fx"><b>' + esc(s.label) + '</b><div class="small muted">owns ' + (s.authority.join(', ') || '—') + ' · ' +
    (s.criticality === 'required' ? 'fail-closed' : 'fail-open') + '</div></div>' +
    '<div class="fr"><span class="tag ' + state[1] + '">' + state[0] + '</span>' +
    '<div class="small muted mono">' + (s.as_of||'').slice(11,16) + ' · ' + (s.age_hours ?? '—') + 'h old</div></div></div>';
}).join('');

/* ---------------- exception queue ---------------- */
let eSev = '', eFlag = '', eQ = '';
$('#excFlag').innerHTML = '<option value="">All flags</option>' +
  [...new Set(EXC.map(e => e.flag))].sort().map(f =>
    '<option value="' + f + '">' + f + ' (' + EXC.filter(e => e.flag === f).length + ')</option>').join('');
function renderExc(){
  const rows = EXC.filter(e => (!eSev || e.severity === eSev) && (!eFlag || e.flag === eFlag) &&
    (!eQ || (e.sku + e.message + e.flag).toLowerCase().includes(eQ)));
  $('#excCount').textContent = rows.length + ' of ' + EXC.length + ' exceptions';
  $('#excCount').className = 'count-note';
  $('#excBody').innerHTML = rows.slice(0,400).map(e =>
    '<tr class="' + (e.sku !== '*' ? 'clk' : '') + '" ' + (e.sku !== '*' ? 'onclick="openSku(\'' + e.sku + '\')"' : '') + '>' +
    '<td><span class="tag ' + sevClass(e.severity) + '">' + e.severity.toUpperCase() + '</span></td>' +
    '<td class="mono small">' + e.flag + '</td>' +
    '<td class="sku">' + (e.sku === '*' ? '<span class="muted">run-level</span>' : e.sku) + '</td>' +
    '<td>' + esc(e.message) + '</td><td class="small muted">' + esc(e.suggested_action) + '</td></tr>').join('')
    || '<tr><td colspan="5" class="empty">Nothing matches this filter.</td></tr>';
}
$$('#excSev button').forEach(b => b.onclick = () => {
  $$('#excSev button').forEach(x => x.classList.remove('on')); b.classList.add('on'); eSev = b.dataset.v; renderExc(); });
$('#excFlag').onchange = e => { eFlag = e.target.value; renderExc(); };
$('#excQ').oninput = e => { eQ = e.target.value.toLowerCase(); renderExc(); };
renderExc();
$('#excExport').onclick = () => download('exceptions_' + stamp() + '.csv', toCsv(
  [['severity','flag','sku','message','suggested_action','evidence']].concat(
    EXC.filter(e => (!eSev || e.severity === eSev) && (!eFlag || e.flag === eFlag) &&
      (!eQ || (e.sku + e.message + e.flag).toLowerCase().includes(eQ)))
      .map(e => [e.severity, e.flag, e.sku, e.message, e.suggested_action, (e.evidence||[]).join('|')]))));

/* ---------------- inventory explorer ---------------- */
let iQ = '', iFlag = '', iConf = '', iSort = 'sku', iDesc = false;
const iLimit = 120;
function renderInv(){
  const rows = ITEMS.filter(i =>
    (!iQ || (i.sku + ' ' + i.description).toLowerCase().includes(iQ)) &&
    (!iFlag || i.flags.some(f => f.startsWith(iFlag))) &&
    (!iConf || i.confidence === iConf)
  ).sort((a,b) => {
    const get = o => ({sku:o.sku, available:o.available, atp_7d:o.atp_7d,
      on_hand:(o.breakdown.on_hand === null ? -1 : o.breakdown.on_hand),
      reserved:o.breakdown.reserved, inbound:o.breakdown.inbound})[iSort];
    const x = get(a), y = get(b);
    const r = typeof x === 'string' ? x.localeCompare(y) : x - y;
    return iDesc ? -r : r;
  });
  $('#invCount').textContent = rows.length + ' of ' + ITEMS.length + ' SKUs';
  $('#invCount').className = 'count-note';
  $('#invBody').innerHTML = rows.slice(0,iLimit).map(i =>
    '<tr class="clk" onclick="openSku(\'' + i.sku + '\')">' +
    '<td class="sku">' + i.sku + '</td><td>' + esc(i.description) + '</td>' +
    '<td class="num"><b>' + fmt(i.available) + '</b>' + (i.raw_available < 0 ? ' <span class="tag t-crit">' + i.raw_available + '</span>' : '') + '</td>' +
    '<td class="num muted">' + fmt(i.atp_7d) + '</td><td class="num">' + fmt(i.breakdown.on_hand) + '</td>' +
    '<td class="num">' + fmt(i.breakdown.reserved) + '</td><td class="num muted">' + fmt(i.breakdown.inbound) + '</td>' +
    '<td><span class="tag ' + (i.confidence==='high'?'t-ok':i.confidence==='medium'?'t-warn':'t-crit') + '">' + i.confidence + '</span></td>' +
    '<td>' + (i.flags.filter(f => !f.startsWith('MISSING_IN_SOURCE')).slice(0,3)
          .map(f => '<span class="flagchip">' + f + '</span>').join('') || '<span class="muted small">clean</span>') + '</td></tr>').join('')
    || '<tr><td colspan="9" class="empty">Nothing matches this filter.</td></tr>';
  $('#invMore').textContent = rows.length > iLimit ?
    'Showing first ' + iLimit + ' of ' + rows.length + '. Narrow the filter or search for a SKU.' : '';
}
$('#invQ').oninput = e => { iQ = e.target.value.toLowerCase(); renderInv(); };
$('#invFlag').onchange = e => { iFlag = e.target.value; renderInv(); };
$('#invConf').onchange = e => { iConf = e.target.value; renderInv(); };
$$('#p-inv th[data-s]').forEach(th => { th.style.cursor = 'pointer';
  th.onclick = () => { iDesc = iSort === th.dataset.s ? !iDesc : true; iSort = th.dataset.s; renderInv(); }; });
renderInv();

const availabilityCsv = () => toCsv(
  [['sku','description','available','raw_available','atp_7d','on_hand','reserved','unsellable',
    'safety_stock','inbound','confidence','flags','sources_seen']].concat(
    ITEMS.map(i => [i.sku, i.description, i.available, i.raw_available, i.atp_7d,
      i.breakdown.on_hand, i.breakdown.reserved, i.breakdown.unsellable, i.breakdown.safety_stock,
      i.breakdown.inbound, i.confidence, i.flags.join('|'), i.sources_seen.join('|')])));
$('#invExport').onclick = () => download('inventory_' + stamp() + '.csv', availabilityCsv());
$('#ccExport').onclick  = () => download('availability_' + stamp() + '.csv', availabilityCsv());

/* ---------------- SKU drawer (lineage) ---------------- */
window.openSku = function(sku){
  const i = ITEM[sku];
  if(!i) return;
  const b = i.breakdown, exc = EXC.filter(e => e.sku === sku);
  const calc =
    '<span class="d">available = on_hand − reserved − unsellable − safety_stock</span>\n' +
    '          = ' + (b.on_hand === null ? 'null' : b.on_hand) + ' − ' + b.reserved + ' − ' + b.unsellable + ' − ' + b.safety_stock + '\n' +
    '          = <span class="' + (i.raw_available < 0 ? 'r' : 'g') + '">' + fmt(i.raw_available) + '</span>' +
    (i.raw_available < 0 ? '   <span class="d">→ published 0 (clamped; shortfall kept as raw_available)</span>' : '') + '\n\n' +
    '<span class="d">atp_7d    = available + inbound arriving inside the 7 day horizon</span>\n' +
    '          = ' + fmt(i.available) + ' + ' + fmt(b.inbound) + ' = <span class="b">' + fmt(i.atp_7d) + '</span>';

  let html =
    '<h1 style="margin-bottom:2px"><span class="sku" style="font-size:20px">' + sku + '</span></h1>' +
    '<p class="sub" style="margin-bottom:16px">' + esc(i.description) + ' · ' + i.category + ' · class ' + i.abc_class +
    ' · unit price ' + money(i.unit_price) + '</p>' +
    '<div class="cards c3">' +
    '<div class="card ' + (i.available > 0 ? 'good' : 'crit') + '"><div class="lab">Available</div><div class="val">' + fmt(i.available) + '</div></div>' +
    '<div class="card blue"><div class="lab">ATP 7 day</div><div class="val">' + fmt(i.atp_7d) + '</div></div>' +
    '<div class="card"><div class="lab">Confidence</div><div class="val" style="font-size:20px;padding-top:8px">' + i.confidence + '</div></div></div>' +
    '<h2>The arithmetic</h2><div class="calc">' + calc + '</div>';

  if(i.by_location.length){
    html += '<h2>By warehouse</h2><div class="tw"><table><thead><tr><th>Location</th><th class="num">On hand</th><th class="num">Reserved</th>' +
      '<th class="num">Damaged</th><th class="num">Buffer</th><th class="num">Available</th><th class="num">Inbound</th></tr></thead><tbody>' +
      i.by_location.map(l => '<tr><td><b>' + l.location + '</b></td><td class="num">' + fmt(l.on_hand) + '</td>' +
        '<td class="num">' + fmt(l.reserved) + '</td><td class="num">' + fmt(l.unsellable) + '</td><td class="num">' + fmt(l.safety_stock) + '</td>' +
        '<td class="num"><b style="color:' + (l.raw_available < 0 ? 'var(--crit)' : 'var(--ok)') + '">' + fmt(l.raw_available) + '</b></td>' +
        '<td class="num muted">' + fmt(l.inbound) + '</td></tr>').join('') + '</tbody></table></div>';
  }
  if(exc.length){
    html += '<h2>Exceptions</h2>' + exc.map(e =>
      '<div class="note ' + (e.severity === 'critical' ? 'crit' : 'warn') + '"><b>' + e.flag + '</b> — ' + esc(e.message) +
      '<br><span class="small">→ ' + esc(e.suggested_action) + '</span></div>').join('');
  }
  if(i.reserved_detail.length){
    html += '<h2>Reserved by — lineage back to source records</h2>' +
      '<div class="tw"><table><thead><tr><th>Order</th><th>Customer</th><th>Status</th><th>Promised</th><th class="num">Qty</th><th>Loc</th></tr></thead><tbody>' +
      i.reserved_detail.slice(0,14).map(r => '<tr><td class="mono small">' + r.order_id +
        (r.otif_penalty ? ' <span class="tag t-crit">OTIF</span>' : '') + '</td>' +
        '<td class="small">' + esc(r.customer) + '</td><td class="small muted">' + r.status + '</td>' +
        '<td class="small muted">' + (r.promised_date || '') + '</td><td class="num">' + fmt(r.qty) + '</td>' +
        '<td class="small">' + r.location + '</td></tr>').join('') + '</tbody></table></div>';
  }
  if(i.inbound_detail.length){
    html += '<h2>Inbound — ATP only, never sellable today</h2>' +
      '<div class="tw"><table><thead><tr><th>PO</th><th>Supplier</th><th>ETA</th><th class="num">Qty</th><th>Loc</th></tr></thead><tbody>' +
      i.inbound_detail.map(d => '<tr><td class="mono small">' + d.po_id + '</td><td class="small">' + esc(d.supplier) + '</td>' +
        '<td class="small">' + d.eta + '</td><td class="num">' + fmt(d.qty) + '</td><td class="small">' + d.location + '</td></tr>').join('') +
      '</tbody></table>';
  }
  html += '<h2>Provenance</h2><p class="small muted" style="margin-top:0">Seen in feeds: ' +
    (i.sources_seen.map(s => '<span class="flagchip">' + s + '</span>').join('') || '—') +
    ((i.missing_sources && i.missing_sources.length) ? ' · absent from: ' + i.missing_sources.map(s => '<span class="flagchip">' + s + '</span>').join('') : '') +
    '</p><p class="small mono muted">' + (i.evidence.map(e => esc(e)).join('  ·  ') || 'no source records') + '</p>';

  $('#drawerBody').innerHTML = html;
  $('#drawer').classList.add('on'); $('#scrim').classList.add('on');
};
$('#drawerX').onclick = $('#scrim').onclick = () => {
  $('#drawer').classList.remove('on'); $('#scrim').classList.remove('on'); };

/* ---------------- formula sandbox ---------------- */
const PROD = JSON.parse(JSON.stringify(RUN.config.buckets));
let SIGNS = JSON.parse(JSON.stringify(PROD));
const BKEY = {ON_HAND:'on_hand', RESERVED:'reserved', UNSELLABLE:'unsellable',
  SAFETY_STOCK:'safety_stock', INBOUND:'inbound', RETURN_IN_TRANSIT:'return_in_transit',
  RETURN_PENDING_QC:'return_pending_qc'};
const bucketTotal = bk => ITEMS.reduce((a,i) => a + (i.breakdown[BKEY[bk]] || 0), 0);
function recompute(){
  let total = 0, oversold = 0, negative = 0;
  for(const i of ITEMS){
    let v = 0;
    for(const bk in BKEY) v += (i.breakdown[BKEY[bk]] || 0) * ((SIGNS[bk] && SIGNS[bk].available_sign) || 0);
    if(v < 0){ negative++; oversold += -v; }
    total += Math.max(v, 0);
  }
  return {total: total, oversold: oversold, negative: negative};
}
function renderFormula(){
  $('#fmBody').innerHTML = Object.keys(SIGNS).map(bk => {
    const d = SIGNS[bk];
    return '<tr><td><b>' + bk + '</b><div class="small muted">' + d.label + '</div></td>' +
      '<td class="small muted">' + d.owner + '</td>' +
      '<td><div class="seg" style="display:inline-flex">' +
      [[1,'add'],[0,'ignore'],[-1,'subtract']].map(o =>
        '<button class="' + (d.available_sign === o[0] ? 'on' : '') + '" onclick="setSign(\'' + bk + '\',' + o[0] + ')" ' +
        'style="padding:5px 9px;font-size:11px">' + o[1] + '</button>').join('') + '</div></td>' +
      '<td><span class="tag ' + (d.atp_sign > 0 ? 't-blue' : d.atp_sign < 0 ? 't-warn' : 't-info') + '">' +
      (d.atp_sign > 0 ? '+' : '') + d.atp_sign + '</span></td>' +
      '<td class="num">' + fmt(bucketTotal(bk)) + '</td></tr>';
  }).join('');

  const r = recompute(), delta = r.total - K.total_available;
  const changed = JSON.stringify(SIGNS) !== JSON.stringify(PROD);
  let impact =
    '<div class="cards c2">' +

  $('#mapSample').innerHTML = (MAP.sample_rows || []).map(r =>
    '<tr>' + cols.map(c => '<td class="mono small">' + esc(r[c]) + '</td>').join('') + '</tr>').join('');
  const conf = c => '<span class="tag ' + (c >= 0.9 ? 't-ok' : c >= 0.8 ? 't-warn' : 't-crit') + '">' +
    Number(c).toFixed(2) + '</span>';
  $('#mapFields').innerHTML = (MAP.field_map || []).map(m =>
    '<tr><td class="mono small"><b>' + m.canonical + '</b></td><td class="mono small">' + m.source_column + '</td>' +
    '<td>' + conf(m.confidence) + '</td><td class="small muted wrap">' + esc(m.note || '') + '</td></tr>').join('');
  $('#mapBuckets').innerHTML = (MAP.status_bucket_map || []).map(m =>
    '<tr><td class="mono small">' + m.source_status + '</td>' +
    '<td><span class="flagchip">' + m.bucket + '</span></td>' +
    '<td>' + conf(m.confidence) + '</td><td class="small muted wrap">' + esc(m.note || '') + '</td></tr>').join('');
  $('#mapNewBuckets').innerHTML = (MAP.new_buckets || []).map(b =>
    '<tr><td><span class="flagchip">' + b.bucket + '</span></td>' +
    '<td class="num">' + (b.available_sign > 0 ? '+' : '') + b.available_sign + '</td>' +
    '<td class="num">' + (b.atp_sign > 0 ? '+' : '') + b.atp_sign + '</td>' +
    '<td>' + conf(b.confidence) + '</td><td class="small muted wrap">' + esc(b.note || '') + '</td></tr>').join('')
    || '<tr><td colspan="5" class="empty">This proposal needs no new buckets.</td></tr>';
  $('#mapQuestions').innerHTML = (MAP.open_questions || []).map((q,i) =>
    '<div class="note warn"><b>' + (i+1) + '.</b> ' + esc(q) + '</div>').join('');
  const v = MAP.validation || {};
  $('#mapValidation').innerHTML =
    '<div class="stat"><span>Bucket names validated against the catalogue</span><b>' +
    '<span class="tag ' + (v.passed ? 't-ok' : 't-crit') + '">' + (v.passed ? 'PASSED' : 'FAILED') + '</span></b></div>' +
    '<div class="stat"><span>New buckets flagged for sign-off</span><b>' +
    fmt((v.new_buckets_requiring_signoff || []).length) + '</b></div>' +
    '<div class="stat"><span>Confidence below 0.80</span><b>escalated, not mapped</b></div>' +
    '<div class="stat"><span>Applied at runtime</span><b><span class="tag t-crit">NEVER</span></b></div>' +
    '<p class="small muted" style="margin:10px 0 0">Checked against: ' +
    (v.catalogue || []).map(b => '<span class="flagchip">' + b + '</span>').join('') + '</p>';
  $('#mapNext').innerHTML = '<b>Next step.</b> ' + esc(MAP.next_step || '');

  $('#aiGuardTable').innerHTML = [
    ['Compute <code>available</code>', 'Deterministic. Always.', 'Auditable, idempotent, legally defensible. This number is why an order gets declined.', 't-ok'],
    ['Apply flag rules', 'Deterministic', 'Same reason. The rules are business policy, not judgement.', 't-ok'],
    ['Demand forecast', 'Statistical models', 'Backtestable against a naive baseline. A generated opinion about demand cannot be.', 't-blue'],
    ['Supplier ETA prediction', 'Statistics', 'Measurable against actual receipt dates.', 't-blue'],
    ['Shrinkage detection', 'Statistics', 'A conservation identity with a noise band, not a narrative.', 't-blue'],
    ['Risk score', 'Weighted formula in config', 'Must be explainable to ops line by line, or it gets ignored.', 't-blue'],
    ['Rank and summarise exceptions', 'Narrative service', 'Language and prioritisation over facts it was given. No arithmetic.', 't-warn'],
    ['Daily brief narrative', 'Narrative service', 'Text generated from supplied figures, every one verified before publishing.', 't-warn'],
    ['Map a new source schema', 'Assistant → human-reviewed config PR', 'A proposal, validated against the catalogue. Never applied live.', 't-warn'],
    ['Resolve orphan SKU aliases', 'Assistant + fuzzy match → human confirms', 'Suggestion only. A wrong alias silently moves stock between SKUs.', 't-warn'],
    ['Natural-language query', 'Assistant → whitelisted API call', 'The engine computes; the service only translates in and narrates out.', 't-warn'],
    ['Draft supplier and customer comms', 'Assistant → a human sends', 'Never auto-sent.', 't-warn'],
    ['Change inventory or orders', 'Neither. Humans only.', 'Irreversible commercial actions with contractual money attached.', 't-crit'],
  ].map(r => '<tr><td>' + r[0] + '</td><td><span class="tag ' + r[3] + '">' + r[1] + '</span></td>' +
    '<td class="small muted">' + r[2] + '</td></tr>').join('');
}

/* ---------------- architecture ---------------- */
$('#archArt').textContent = __ARCH_ART__;
$('#archNotes').innerHTML = [
  ['Ledger, not a formula', 'Every source contributes signed quantities into buckets. The formula is defined over buckets in config, so a new source never touches the aggregation engine.'],
  ['Inbound is not availability', 'Inbound stock is excluded from available and kept in ATP with a date horizon. Mixing it in is the exact arithmetic that causes the oversell.'],
  ['Conservative bias', 'Overstating costs chargebacks; understating costs a little deferred revenue. Every ambiguity resolves downward — unknown on hand publishes as zero, with a flag.'],
  ['Null is not zero', 'on_hand: null means unknown — an item master sync problem. on_hand: 0 means genuinely out of stock. Different fixes, so different values.'],
  ['Nothing double counted', 'Shipped order lines are already out of the WMS count; received POs are already in it; restocked returns likewise. All three are excluded by the same status-mapping mechanism.'],
  ['Network number, location detail', 'The published figure is the network total clamped once, so it can never exceed real stock. A single short warehouse surfaces as LOCATION_OVERSOLD, whose fix is a transfer, not a sale.'],
  ['Idempotent by construction', 'Full recompute from immutable snapshots, input hashes in the manifest. Same inputs, byte-identical output, safe to retry.'],
].map(n => '<div style="margin-bottom:14px"><b>' + n[0] + '</b><div class="small muted">' + n[1] + '</div></div>').join('');
$('#archPhases').innerHTML = [
  ['0','Discovery: profile the feeds, agree which order statuses hold stock, document the manual process','3–5 days'],
  ['1','Canonical model, adapters, availability formula, CLI, CSV/JSON output — run in shadow mode','2 weeks'],
  ['2','Flag engine, exception queue, run manifest, lineage and explain','1 week'],
  ['3','REST API, dashboard integration, scheduling, staleness alerting — spreadsheet retired','1–2 weeks'],
  ['4','Returns adapter, ATP horizons, safety stock, reorder signals','1 week'],
].map(p => '<tr><td><b>' + p[0] + '</b></td><td class="small">' + p[1] + '</td><td class="small muted">' + p[2] + '</td></tr>').join('');
</script>
</body>
